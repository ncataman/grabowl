<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grabowl — Privacy Policy</title>
<meta name="description" content="Grabowl collects no data. No accounts, no analytics, no servers.">
<!--
  Single-file privacy policy for all three store listings.
  Every store requires a publicly reachable URL; upload this as
  https://<domain>/privacy/ and paste that URL into each listing.
  Ten languages in one page so a single URL serves every localized listing.
-->
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --dim:#9198a1; --line:#22272e; --accent:#4493f8; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#fff; --fg:#1f2328; --dim:#59636e; --line:#d1d9e0; --accent:#0969da; }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 48px 20px 90px;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 30px; letter-spacing: -.02em; margin-bottom: 6px; }
  .updated { color: var(--dim); font-size: 14px; margin-bottom: 28px; }
  h2 { font-size: 19px; margin: 32px 0 8px; }
  p { margin-bottom: 12px; }
  ul { margin: 0 0 12px 22px; }
  li { margin-bottom: 6px; }
  a { color: var(--accent); }
  .lede {
    border-inline-start: 3px solid var(--accent);
    padding: 12px 16px; background: color-mix(in srgb, var(--accent) 9%, transparent);
    border-radius: 0 8px 8px 0; margin-bottom: 8px;
  }
  nav.langs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 34px; }
  nav.langs button {
    font: inherit; font-size: 13px; padding: 5px 11px; cursor: pointer;
    background: transparent; color: var(--fg);
    border: 1px solid var(--line); border-radius: 999px;
  }
  nav.langs button[aria-current="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--dim); font-size: 14px; }
  section[hidden] { display: none; }
  [dir="rtl"] { text-align: right; }
</style>
</head>
<body>
<main>
  <nav class="langs" id="langs" aria-label="Language"></nav>
  <div id="content"></div>
  <footer>
    <p>Grabowl — <a href="mailto:info@ncataman.com">info@ncataman.com</a></p>
    <p>Not affiliated with, endorsed by, or sponsored by Instagram or Meta Platforms, Inc.</p>
  </footer>
</main>

const ORDER = ['en','tr','pt_BR','es','id','hi','ar','ru','de','fr'];
const nav = document.getElementById('langs');
const content = document.getElementById('content');

function render(code) {
  const doc = DOC[code];
  document.documentElement.lang = code.replace('_', '-');
  document.documentElement.dir = doc.dir;
  document.title = `Grabowl — ${doc.title}`;

  content.innerHTML = '';
  const h1 = document.createElement('h1');
  h1.textContent = doc.title;
  const updated = document.createElement('div');
  updated.className = 'updated';
  updated.textContent = UPDATED;
  const lede = document.createElement('p');
  lede.className = 'lede';
  lede.textContent = doc.lede;
  content.append(h1, updated, lede);

  for (const [heading, paras] of doc.sections) {
    const h2 = document.createElement('h2');
    h2.textContent = heading;
    content.append(h2);
    if (paras.length > 1 && heading === doc.sections[0][0]) {
      const ul = document.createElement('ul');
      for (const text of paras) {
        const li = document.createElement('li');
        li.textContent = text;
        ul.append(li);
      }
      content.append(ul);
    } else {
      for (const text of paras) {
        const p = document.createElement('p');
        p.textContent = text;
        content.append(p);
      }
    }
  }

  for (const button of nav.children) {
    button.setAttribute('aria-current', String(button.dataset.code === code));
  }
  history.replaceState(null, '', `#${code}`);
}

for (const code of ORDER) {
  const button = document.createElement('button');
  button.textContent = DOC[code].name;
  button.dataset.code = code;
  button.addEventListener('click', () => render(code));
  nav.append(button);
}

// Open in the reader's own language when we have it, otherwise English.
const wanted = location.hash.slice(1);
const browserLang = (navigator.language || 'en').toLowerCase();
const guess =
  ORDER.find((c) => c.toLowerCase() === browserLang) ||
  ORDER.find((c) => c.toLowerCase() === browserLang.split('-')[0]) ||
  'en';
render(DOC[wanted] ? wanted : guess);
</script>
